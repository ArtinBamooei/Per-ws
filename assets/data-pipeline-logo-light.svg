<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--p)"/><stop offset="1" stop-color="var(--p2)"/></linearGradient>
<linearGradient id="m" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".5" stop-color="var(--m2)"/><stop offset="1" stop-color="var(--m)"/></linearGradient>
<linearGradient id="w"><stop stop-color="var(--b2)" stop-opacity=".15"/><stop offset=".5" stop-color="var(--b)"/><stop offset="1" stop-color="var(--b3)" stop-opacity=".2"/></linearGradient>
<filter id="s" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="var(--sh)" flood-opacity=".2"/></filter>
<g id="db"><ellipse rx="17" ry="6" fill="url(#g)" stroke="var(--m)"/><path d="M-17 0v25c0 8 34 8 34 0V0" fill="url(#m)" stroke="var(--m)"/><path d="M-17 8c0 8 34 8 34 0M-17 17c0 8 34 8 34 0" fill="none" stroke="var(--e)"/><ellipse rx="17" ry="6" fill="url(#g)" stroke="var(--m)"/></g>
</defs>
<style>
:root{--p:#fff;--p2:#f0f4f7;--e:#cbd4dc;--m:#a7b4bf;--m2:#dfe6eb;--b:#77d0f4;--b2:#c2eeff;--b3:#38a9df;--sh:#8193a2}
.flow{stroke-dasharray:7 8;animation:d 2.5s linear infinite}.d1{animation-delay:-.8s}.d2{animation-delay:-1.6s}.packet{animation:p 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.p2{animation-delay:-.8s}.p3{animation-delay:-1.6s}.halo{animation:h 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes d{to{stroke-dashoffset:-60}}@keyframes p{0%,100%{opacity:.2;transform:translateY(-3px)}50%{opacity:1;transform:translateY(7px)}}@keyframes h{0%,100%{opacity:.1;transform:scale(.7)}50%{opacity:.35;transform:scale(1.6)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<!-- three floating glass plates -->
<g filter="url(#s)"><path d="M34 157 218 66 408 157 220 272Z" fill="url(#g)" stroke="var(--e)" stroke-width="1.7"/><path d="M34 157v8l186 115 188-115v-8" fill="url(#m)" fill-opacity=".45" stroke="var(--e)"/></g>
<g filter="url(#s)"><path d="M34 292 218 204 406 292 220 403Z" fill="url(#g)" stroke="var(--e)" stroke-width="1.7"/><path d="M34 292v8l186 103 186-111v-8" fill="url(#m)" fill-opacity=".45" stroke="var(--e)"/></g>
<g filter="url(#s)"><path d="M38 420 218 331 402 420 220 530Z" fill="url(#g)" stroke="var(--e)" stroke-width="1.7"/><path d="M38 420v8l182 102 182-110v-8" fill="url(#m)" fill-opacity=".45" stroke="var(--e)"/></g>
<!-- translucent data paths and convergence funnel -->
<g fill="none" stroke="url(#w)" stroke-width="3.2" stroke-linecap="round"><path class="flow" d="M85 191Q142 230 207 264Q220 273 220 302V434"/><path class="flow d1" d="M170 190Q182 225 220 264V434"/><path class="flow d2" d="M341 191Q296 231 233 265Q220 274 220 302V434"/></g>
<path d="M184 258h72l-17 31-7 14v17h-24v-17l-7-14Z" fill="url(#g)" fill-opacity=".8" stroke="var(--e)" stroke-width="1.5"/><path d="M201 277h38l-8 16h-22Z" fill="var(--b)" opacity=".18"/><path class="flow" d="M220 279V437" fill="none" stroke="var(--b3)" stroke-width="2.5"/>
<!-- upper layer: analytics dashboard -->
<g stroke-linejoin="round" stroke-linecap="round">
<path d="M66 130 115 106 144 120 94 146Z" fill="url(#m)" stroke="var(--m)"/><path d="M66 130V84q0-5 5-8l45-22q6-2 10 2l18 10q4 3 4 8v46l-54 27Z" fill="url(#g)" stroke="var(--e)" stroke-width="1.5" transform="translate(0 22)"/>
<path d="M78 118V84l53-27v52Z" fill="var(--p)" fill-opacity=".5" stroke="var(--e)"/>
<path d="M84 113V99m11 8V91m11 11V82m11 14V74" stroke="var(--b)" stroke-width="4"/><path d="M84 87 96 75l8 4 16-19" fill="none" stroke="var(--m)" stroke-width="1.6"/><path d="M114 60h6v6M84 71h18m-18-6h24" fill="none" stroke="var(--m)" stroke-width="1.4"/>
<path d="M117 69a14 14 0 0 1 14 14h-14Z" fill="#9fc9e1"/><path d="M117 69v14h-14a14 14 0 0 1 14-14Z" fill="#d7e6ef"/><path d="M117 83h14a14 14 0 0 1-14 14Z" fill="#bfd7e6"/><path d="M117 83v14a14 14 0 0 1-14-14Z" fill="#e7eef3"/>
</g>
<!-- bar chart -->
<g fill="url(#m)" stroke="var(--e)" stroke-width="1.2"><path d="M166 143 178 137v24l-12 6Z"/><path d="M182 135 194 129v34l-12 6Z"/><path d="M198 125 210 119v45l-12 6Z"/><path d="M214 115 226 109v55l-12 6Z"/></g>
<!-- neural-network node mesh -->
<g fill="none" stroke="var(--m)" stroke-width="1.3"><path d="M266 93 244 111 264 129 287 112 266 93 251 148 264 129 282 151 287 112 304 126 264 129 244 111 251 148 282 151 304 126M266 93 282 151M244 111 304 126"/></g><g fill="url(#m)" stroke="var(--m)" stroke-width="1.2"><circle cx="266" cy="93" r="7"/><circle cx="244" cy="111" r="7"/><circle cx="287" cy="112" r="7"/><circle cx="264" cy="129" r="7"/><circle cx="304" cy="126" r="7"/><circle cx="251" cy="148" r="7"/><circle cx="282" cy="151" r="7"/></g>
<!-- octagonal AI chat tile -->
<path d="M328 103 348 83 377 91 391 113 380 140 356 153 334 141Z" fill="url(#g)" stroke="var(--e)" stroke-width="2"/><path d="M337 107 352 93 373 98 383 115 375 135 356 145 339 135Z" fill="none" stroke="var(--e)" stroke-width="1.3"/><g fill="var(--b3)"><circle cx="349" cy="119" r="3.4"/><circle cx="361" cy="119" r="3.4"/><circle cx="373" cy="119" r="3.4"/></g>
<!-- middle layer: mechanical processing, data transform, gear, cube -->
<g stroke-linejoin="round"><path d="M68 291 97 277 123 290 94 305Z" fill="url(#m)" stroke="var(--m)"/><path d="M68 291v31l26 16 29-17v-31l-29 15Z" fill="url(#g)" stroke="var(--m)"/><path d="M78 296v20l16 9 18-10v-20l-18 9Z" fill="var(--p2)" stroke="var(--e)"/><g stroke="var(--m)" stroke-width="2"><path d="M84 300v15m6-18v20m6-20v20m6-22v19"/></g></g>
<path d="M157 291 175 282 193 291 175 301Z" fill="url(#m)" stroke="var(--m)"/><path d="M157 291v24l18 11 18-11v-24l-18 10Z" fill="url(#g)" stroke="var(--m)"/><path d="M164 295 175 289 186 295 175 301Z" fill="var(--p)" stroke="var(--e)"/><g fill="var(--b3)"><circle cx="169" cy="306" r="1.4"/><circle cx="175" cy="303" r="1.4"/><circle cx="181" cy="306" r="1.4"/><circle cx="169" cy="312" r="1.4"/><circle cx="175" cy="309" r="1.4"/><circle cx="181" cy="312" r="1.4"/></g>
<g transform="translate(232 304)"><circle r="20" fill="url(#m)" stroke="var(--m)" stroke-width="1.5"/><g fill="url(#m)" stroke="var(--m)" stroke-width="1"><rect x="-4" y="-27" width="8" height="12" rx="1"/><rect x="-4" y="15" width="8" height="12" rx="1"/><rect x="-27" y="-4" width="12" height="8" rx="1"/><rect x="15" y="-4" width="12" height="8" rx="1"/><rect x="-4" y="-27" width="8" height="12" rx="1" transform="rotate(45)"/><rect x="-4" y="-27" width="8" height="12" rx="1" transform="rotate(90)"/><rect x="-4" y="-27" width="8" height="12" rx="1" transform="rotate(135)"/></g><circle r="12" fill="url(#g)" stroke="var(--m)" stroke-width="3"/><circle r="5" fill="var(--m2)" stroke="var(--m)"/></g>
<g stroke="var(--e)" stroke-width="1.2"><path d="M285 286 307 275 329 286 307 298Z" fill="url(#m)"/><path d="M285 286v29l22 13v-30Z" fill="url(#m)"/><path d="M307 298 329 286v29l-22 13Z" fill="url(#g)"/><path d="M285 296 307 309 329 296M285 306 307 319 329 306M296 280v39m22-34v39" fill="none"/></g>
<!-- bottom layer: database cylinders -->
<g filter="url(#s)"><g transform="translate(112 433) scale(.82)"><use href="#db"/></g><g transform="translate(167 443) scale(1.02)"><use href="#db"/></g><g transform="translate(229 451) scale(1.22)"><use href="#db"/></g></g>
<!-- server rack -->
<g transform="translate(264 432)" stroke="var(--m)" stroke-width="1.2" stroke-linejoin="round"><path d="M0 13 24 1 47 14 23 28Z" fill="url(#m)"/><path d="M0 13v42l23 14V28Z" fill="url(#m)"/><path d="M23 28 47 14v42L23 69Z" fill="url(#g)"/><g fill="none" stroke="var(--e)"><path d="M4 23 20 32v7L4 30ZM4 35 20 44v7L4 42ZM27 34 42 25v7L27 41ZM27 46 42 37v7L27 53Z"/></g><g fill="var(--b3)"><circle cx="9" cy="29" r="1.2"/><circle cx="9" cy="41" r="1.2"/><circle cx="32" cy="37" r="1.2"/><circle cx="32" cy="49" r="1.2"/></g></g>
<!-- cloud storage with data points -->
<path d="M321 452c-8 0-13-5-13-12 0-6 4-11 10-12 2-11 11-17 21-14 8 2 12 8 13 15 9-1 16 5 16 13 0 7-6 12-14 12Z" fill="url(#g)" stroke="var(--m)" stroke-width="1.5"/><path d="M324 442c0-7 4-11 10-11 6 0 9 4 10 10 7-1 12 3 12 8" fill="none" stroke="var(--e)"/><g fill="var(--b3)"><circle cx="329" cy="437" r="1.5"/><circle cx="337" cy="434" r="1.5"/><circle cx="345" cy="439" r="1.5"/><circle cx="333" cy="445" r="1.5"/><circle cx="342" cy="445" r="1.5"/><circle cx="350" cy="447" r="1.5"/></g>
<g fill="var(--b3)"><circle class="packet" cx="220" cy="248" r="3.2"/><circle class="packet p2" cx="220" cy="342" r="3.2"/><circle class="packet p3" cx="220" cy="414" r="3.2"/></g><g fill="var(--b)"><circle class="halo" cx="220" cy="248" r="8" opacity=".2"/><circle class="halo" cx="220" cy="342" r="8" opacity=".2"/><circle class="halo" cx="220" cy="414" r="8" opacity=".2"/></g>
</svg>