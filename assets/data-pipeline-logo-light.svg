<style>
.flow{stroke-dasharray:6 8;animation:flow 2.8s linear infinite}.flow-b{animation-delay:-1s}.flow-c{animation-delay:-1.8s}.packet{transform-box:fill-box;transform-origin:center;animation:packet 2.8s ease-in-out infinite}.p2{animation-delay:-.9s}.p3{animation-delay:-1.8s}.pulse{animation:pulse 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center}.pulse2{animation-delay:-1.2s}@keyframes flow{to{stroke-dashoffset:-56}}@keyframes packet{0%,100%{opacity:.25;transform:translateY(-3px)}50%{opacity:1;transform:translateY(8px)}}@keyframes pulse{0%,100%{opacity:.05;transform:scale(.6)}50%{opacity:.24;transform:scale(1.7)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style></svg>