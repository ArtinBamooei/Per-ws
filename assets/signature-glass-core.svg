<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Signature glass data core</title><desc id="desc">A sculptural stack of translucent glass planes surrounding a glowing amber core, with fine orbital data filaments and luminous terminals.</desc>
<defs>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".76"/><stop offset=".48" stop-color="#dce9f0" stop-opacity=".24"/><stop offset="1" stop-color="#9fb6c5" stop-opacity=".38"/></linearGradient>
 <linearGradient id="glassWarm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".78"/><stop offset=".52" stop-color="#f7d8bd" stop-opacity=".32"/><stop offset="1" stop-color="#e7a36b" stop-opacity=".42"/></linearGradient>
 <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity=".95"/><stop offset=".5" stop-color="#efb27d" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity=".68"/></linearGradient>
 <linearGradient id="amberTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe1a2"/><stop offset=".48" stop-color="#ff9f36"/><stop offset="1" stop-color="#e65b08"/></linearGradient>
 <linearGradient id="amberFace" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#ffb64f"/><stop offset="1" stop-color="#c94b08"/></linearGradient>
 <radialGradient id="orb"><stop stop-color="#ffe8ad"/><stop offset=".42" stop-color="#ff9d24"/><stop offset="1" stop-color="#e75a04"/></radialGradient>
 <radialGradient id="coreGlow"><stop stop-color="#ff9c31" stop-opacity=".42"/><stop offset="1" stop-color="#ff9c31" stop-opacity="0"/></radialGradient>
 <filter id="blurGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="26"/></filter>
 <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
 <filter id="planeShadow" x="-35%" y="-35%" width="180%" height="190%"><feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/><feOffset dy="10" result="offset"/><feComponentTransfer><feFuncA type="linear" slope=".24"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g class="ambient"><ellipse cx="640" cy="455" rx="330" ry="270" fill="url(#coreGlow)" filter="url(#blurGlow)"/><path d="M150 385C190 170 420 110 650 120S1080 245 1080 440C1080 650 900 760 680 790" fill="none" stroke="#e8a36b" stroke-opacity=".48" stroke-width="2"/><path d="M160 620C245 790 470 835 665 790S1000 690 1080 520" fill="none" stroke="#d6e1e8" stroke-opacity=".8" stroke-width="2"/><path d="M280 230C420 155 550 160 690 210S940 295 1030 400" fill="none" stroke="#fff" stroke-opacity=".78" stroke-width="2"/></g>
<g class="rear-fin"><path d="M690 105L925 185V580L690 650Z" fill="url(#glass)" stroke="url(#glassEdge)" stroke-width="3"/><path d="M704 122L909 192V562" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2"/><path d="M735 210L880 258M735 226L880 274M735 242L880 290" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="8"/></g>
<g class="rear-platform" filter="url(#planeShadow)"><path d="M300 320L605 205L930 315L620 438Z" fill="url(#glass)" stroke="#f9fcff" stroke-opacity=".84" stroke-width="3"/><path d="M300 320L620 438V475L300 356Z" fill="#849aa9" fill-opacity=".43" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><path d="M620 438L930 315V352L620 475Z" fill="#c77b43" fill-opacity=".34" stroke="#f4c49a" stroke-opacity=".68" stroke-width="2"/></g>
<g class="lower-platform" filter="url(#planeShadow)"><path d="M260 545L620 410L1000 545L640 690Z" fill="url(#glass)" stroke="url(#glassEdge)" stroke-width="3"/><path d="M260 545L640 690V730L260 585Z" fill="#8299a8" fill-opacity=".5" stroke="#fff" stroke-opacity=".7" stroke-width="2"/><path d="M640 690L1000 545V585L640 730Z" fill="#bd7137" fill-opacity=".39" stroke="#f6c18e" stroke-opacity=".8" stroke-width="2"/></g>
<ellipse class="core-halo" cx="635" cy="450" rx="190" ry="150" fill="url(#coreGlow)" filter="url(#softGlow)"/>
<g class="core-cube"><path d="M520 355L635 310L755 355L638 410Z" fill="url(#amberTop)" fill-opacity=".94" stroke="#ffe0a6" stroke-width="2.5"/><path d="M520 355L638 410V555L520 493Z" fill="url(#amberFace)" fill-opacity=".9" stroke="#ffd08a" stroke-width="2.5"/><path d="M638 410L755 355V492L638 555Z" fill="#f27612" fill-opacity=".88" stroke="#ffc16d" stroke-width="2.5"/><path d="M544 370L638 414V529" fill="none" stroke="#fff0c9" stroke-opacity=".58" stroke-width="3"/><path d="M660 420L734 385V475" fill="none" stroke="#ffe0a5" stroke-opacity=".55" stroke-width="2"/></g>
