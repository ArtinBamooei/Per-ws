<g class="side-wings" filter="url(#planeShadow)"><path d="M250 380L350 338V650L250 612Z" fill="url(#glass)" stroke="#fff" stroke-width="3"/><path d="M250 380L350 338V362L250 404Z" fill="#c5d5df" fill-opacity=".42"/><path d="M905 340L1005 382V642L905 600Z" fill="url(#glassWarm)" stroke="#f9d0a8" stroke-width="3"/></g>
<g class="front-panel" filter="url(#planeShadow)"><path d="M185 500L325 440L490 505L350 570Z" fill="url(#glass)" stroke="#fff" stroke-width="3"/><path d="M185 500L350 570V735L185 665Z" fill="#8098a8" fill-opacity=".48" stroke="#fff" stroke-opacity=".85" stroke-width="3"/><path d="M350 570L490 505V670L350 735Z" fill="#c47c48" fill-opacity=".34" stroke="#fff" stroke-opacity=".8" stroke-width="3"/></g>
<g class="floating-module"><path d="M440 760L540 720L635 758L535 800Z" fill="url(#glass)" stroke="#fff" stroke-width="2.5"/><path d="M440 760L535 800V820L440 780Z" fill="#aabec9" fill-opacity=".28" stroke="#fff" stroke-opacity=".65"/></g>
<g class="data-filaments" fill="none" stroke-linecap="round"><path d="M195 455L195 405L250 380M1040 430L1005 410M635 165V195M820 705V755" stroke="#f5a34d" stroke-width="1.5" stroke-opacity=".72"/><path d="M220 690C270 790 400 815 520 790L565 775" stroke="#e6a36a" stroke-width="2.5" stroke-opacity=".8"/><path d="M800 165C980 205 1080 310 1090 420" stroke="#fff" stroke-width="2" stroke-opacity=".82"/><path d="M735 745L840 790L940 748" stroke="#e8a56f" stroke-width="2" stroke-opacity=".75"/></g>
<g class="orbit-nodes"><g class="node node-top"><circle cx="635" cy="165" r="18" fill="url(#orb)"/><circle cx="635" cy="165" r="25" fill="none" stroke="#ffb34d" stroke-opacity=".34"/></g><g class="node node-right"><circle cx="1040" cy="430" r="26" fill="url(#orb)"/><circle cx="1040" cy="430" r="35" fill="none" stroke="#ffb34d" stroke-opacity=".28"/></g><g class="node node-left"><circle cx="195" cy="455" r="17" fill="url(#orb)"/><circle cx="195" cy="455" r="25" fill="none" stroke="#ffb34d" stroke-opacity=".35"/></g><g class="node node-bottom"><circle cx="820" cy="705" r="20" fill="url(#orb)"/><circle cx="820" cy="705" r="29" fill="none" stroke="#ffb34d" stroke-opacity=".28"/></g><circle cx="300" cy="250" r="7" fill="url(#orb)"/><circle cx="1080" cy="300" r="10" fill="url(#orb)"/><circle cx="235" cy="690" r="9" fill="url(#orb)"/></g>
</svg>